{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surplus Food Distribution</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">

<!-- ================= NAVBAR ================= -->
<nav class="bg-white shadow-md border-b">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">

        <h1 class="text-xl font-bold text-green-600">
            🍱 SurplusFood
        </h1>

        <div class="space-x-6 hidden md:flex">

            <a href="{% url 'customerfoods' %}" class="hover:text-green-600">
                Home
            </a>

            <a href="{% url 'customerprofile' %}" class="hover:text-green-600">
                Profile
            </a>

            <a href="{% url 'cartlist' %}" class="hover:text-green-600">
                Cart<i class="fa-solid fa-cart-shopping"></i>
                <span>{{cartCount}}</span>
            </a>

            <a href="{% url 'orders' %}" class="hover:text-green-600">
                Orders
            </a>
               <a href="{% url 'logout' %}" class="hover:text-green-600">
                Logout
            </a>
        </div>
    </div>
</nav>

<!-- ================= CONTENT ================= -->
<main class="flex-grow">
    {% block base %}
    {% endblock %}
</main>

<!-- ================= FOOTER ================= -->
<footer class="bg-gray-900 text-white text-center py-4">
    <p>© 2026 Surplus Food Distribution</p>
</footer>

</body>
</html>
