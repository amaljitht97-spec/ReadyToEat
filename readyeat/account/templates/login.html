<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ready Eat</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

<div class="min-h-screen flex items-center justify-center bg-cover bg-center bg-no-repeat relative"
    style="background-image: url('https://images.unsplash.com/photo-1488459716781-31db52582fe9?auto=format&fit=crop&w=1600&q=80');">

    <!-- Dark Overlay -->
    <div class="absolute inset-0 bg-black/50"></div>

    <!-- Login Card -->
    <div class="relative bg-white rounded-3xl shadow-2xl flex flex-col lg:flex-row w-full max-w-5xl overflow-hidden mx-4">

        <!-- Left Side Image -->
        <div class="hidden lg:block lg:w-1/2">
            <img src="https://images.openai.com/static-rsc-4/46rcSNmptoTAP3k81Uave_ZbnOdlbmh0D4hyqeZxHnbN8jZpV5yWJ247wbqWd20cFhKaDtrbz3yQpw5Jxw9_u12tT3LqT-wOmZCcIIw7MpE2SuRHw50MB57LGqRO99N4HahT-VeX7L7zZGiA7It4z9_5pttoyr0VSQ1gSdUH0gykAbd3O1zAB3oTwjloBBCm?purpose=fullsize"
                alt="Food Donation"
                class="w-full h-full object-cover">
        </div>

        <!-- Login Form -->
        <div class="w-full lg:w-1/2 p-10 flex flex-col justify-center">

            <h1 class="text-4xl font-bold text-center text-[#00674b] mb-2">
                Welcome Back
            </h1>

            <p class="text-center text-gray-500 mb-8">
                Login to your Ready Eat account
            </p>

            <!-- Divider -->
            <div class="flex items-center mb-6">
                <hr class="flex-1 border-gray-300">
                <span class="px-3 text-gray-500 text-sm">LOGIN</span>
                <hr class="flex-1 border-gray-300">
            </div>

            <form method="POST" class="space-y-5">

                {% csrf_token %}

                <input type="hidden" name="next" value="{{ next }}">

                <!-- Username -->
                <div>
                    <label class="block text-gray-700 mb-2 font-medium">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter Username"
                        required
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#00674b]">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-gray-700 mb-2 font-medium">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter Password"
                        required
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#00674b]">
                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="w-full py-3 rounded-xl text-white font-semibold text-lg transition duration-300 hover:opacity-90"
                    style="background-color:#00674b;">

                    Login

                </button>

                <!-- Links -->
                <div class="flex justify-between text-sm mt-4">

                    <a href="#"
                        class="text-gray-600 hover:text-[#00674b] transition">
                        Forgot Password?
                    </a>

                    <a href="{% url 'signup' %}"
                        class="text-[#00674b] font-semibold hover:underline">
                        Create Account
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
