{% extends 'base.html' %}
{% load static %}

{% block base %}

<div class="flex items-center justify-center min-h-[80vh] bg-gray-100 px-4">

    <div class="bg-white shadow-xl rounded-2xl p-10 text-center max-w-md w-full">

        <!-- ✅ Icon -->
        <div class="flex justify-center mb-4">
            <div class="bg-green-100 text-green-600 rounded-full p-4">
                <svg xmlns="http://www.w3.org/2000/svg" 
                     class="h-10 w-10" fill="none" viewBox="0 0 24 24" 
                     stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" 
                          stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
            </div>
        </div>

        <!-- 🎉 Message -->
        <h2 class="text-2xl font-bold text-gray-800 mb-2">
            Order Placed Successfully!
        </h2>

        <p class="text-gray-600 mb-6">
            Thank you for your order. Your food will be delivered soon
        </p>

        <!-- 📦 Order Info -->
        {% if data %}
        <div class="bg-gray-50 rounded-lg p-4 mb-6 text-left">
            <p class="text-sm text-gray-500">Order ID</p>
            <p class="font-semibold text-gray-800">
                #{{ data.razer_pay_order_id }}
            </p>

            <p class="text-sm text-gray-500 mt-2">Total</p>
            <p class="font-semibold text-green-600">
                ₹ {{ data.total }}
            </p>
        </div>
        {% endif %}

        <!-- 🔘 Buttons -->
        <div class="space-y-3">

            <a href="{% url 'homedash' %}"
               class="block w-full bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg font-semibold transition">
                Go to Home
            </a>

            <a href="{% url 'ordersview' order.id %}"
               class="block w-full border border-gray-300 hover:bg-gray-100 py-2 rounded-lg font-semibold transition">
                View Orders
            </a>

        </div>

    </div>

</div>

{% endblock %}
