<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donor Location</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>

<body class="bg-gray-100">

<div class="max-w-4xl mx-auto mt-10 bg-white p-6 rounded-xl shadow">

    <h2 class="text-xl font-bold text-gray-700 mb-4">
        📍 Donor Location
    </h2>

    <!-- MAP -->
    <div id="map" class="w-full h-96 rounded-lg"></div>

    <!-- INFO -->
    <div class="mt-4 text-gray-700 space-y-2">
        <p><strong>Organization:</strong> {{ donor.organization_name|default:"Not available" }}</p>
        <p><strong>Phone:</strong> {{ donor.phone|default:"Not available" }}</p>
        <p><strong>Address:</strong> {{ donor.address|default:"Not available" }}</p>
    </div>

    <!-- GOOGLE MAP BUTTON -->
    <div class="mt-4">
        <a href="https://www.google.com/maps?q={{ donor.latitude|default:'0' }},{{ donor.longitude|default:'0' }}"
           target="_blank"
           class="bg-blue-600 text-white px-4 py-2 rounded-lg inline-block">
            Open in Google Maps
        </a>
    </div>

</div>

<script>

    // SAFE VALUES FROM DJANGO
    var lat = "{{ donor.latitude|default:'0' }}";
    var lng = "{{ donor.longitude|default:'0' }}";

    lat = parseFloat(lat);
    lng = parseFloat(lng);

    // DEFAULT LOCATION (Kozhikode fallback)
    if (!lat || !lng) {
        lat = 11.2588;
        lng = 75.7804;
    }

    // INIT MAP
    var map = L.map('map').setView([lat, lng], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // MARKER
    L.marker([lat, lng]).addTo(map)
        .bindPopup("Food Pickup Location")
        .openPopup();

</script>

</body>
</html>
