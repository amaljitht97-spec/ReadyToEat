<!doctype html>
<html lang="en">

<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS v5.2.1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="d-flex justify-content-center align-items-center " style="height:100vh;">
        <div class="w-50 border border-3 shadow bg-light">
            <h1 class="text-center">Payment info</h1>
            <h2>Amount : <span>{{data.amount}}</span></h2>
            <div class="d-grid">
                <button id="rzp-button1">Pay with Razorpay</button>

            </div>


        </div>
    </div>
    <button id="rzp-button1">Pay with Razorpay</button>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>
        var options = {
            "key": "{{data.razr_key_id}}",

            
            "amount": "{{ data.amount }}",

        "currency": "INR",
            "name": "Readyeat",
                "description": "Test Transaction",
                    "image": "https://example.com/your_logo",
                        "order_id": "{{data.razr_pay_id}}",

       
        "callback_url": "http://127.0.0.1:8000/customer/pay-verify/",

            "prefill": {
            "name": "Gaurav Kumar",
                "email": "gaurav.kumar@example.com",
                    "contact": "+919876543210"
        },

        "notes": {
            "address": "Razorpay Corporate Office"
        },

        "theme": {
            "color": "#3399cc"
        },

        "handler": function (response) {
            console.log(response);
        }
};

        var rzp1 = new Razorpay(options);

        document.getElementById('rzp-button1').onclick = function (e) {
            rzp1.open();
            e.preventDefault();
        };
    </script>

</body>

</html>
