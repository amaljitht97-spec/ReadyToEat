<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Food Item</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f7f8;
        }

        .card-form{
            max-width:850px;
            margin:50px auto;
            background:#fff;
            border:1px solid #4D7C0F;
            border-radius:12px;
            padding:35px;
            box-shadow:0 8px 20px rgba(0,0,0,.08);
        }

        h2{
            color:#4D7C0F;
            font-weight:700;
            margin:0;
        }

        label{
            font-weight:600;
            margin-bottom:8px;
        }

        .form-control,
        .form-select{
            height:48px;
            border-radius:8px;
        }

        textarea.form-control{
            height:120px;
        }

        .btn-submit,
        .btn-secondary{
            height:48px;
            min-width:120px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:8px;
            font-weight:600;
        }

        .btn-submit{
            background:#4D7C0F;
            color:white;
            border:none;
        }

        .btn-submit:hover{
            background:#3c630b;
            color:white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card-form">

        <h2 class="mb-4">Add Food Item</h2>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <!-- Food Item -->
            <div class="mb-3">
                <label>Food Item</label>
                {{ form.food_items }}
            </div>

            <!-- Food Title -->
            <div class="mb-3">
                <label>Food Title</label>
                {{ form.food_title }}
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label>Description</label>
                {{ form.food_description }}
            </div>

            <!-- Food Image -->
            <div class="mb-3">
                <label>Food Image</label>
                {{ form.food_images }}
            </div>

            <!-- Quantity & Price -->
            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Quantity</label>
                    {{ form.quantity }}
                </div>

                <div class="col-md-6 mb-3">
                    <label>Price</label>
                    {{ form.price }}
                </div>

            </div>

            <!-- Checkboxes -->
            <div class="row">

                <div class="col-md-6">
                    <div class="form-check mt-3">
                        {{ form.is_free }}
                        <label class="form-check-label">
                            Is Free
                        </label>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-check mt-3">
                        {{ form.available }}
                        <label class="form-check-label">
                            Available
                        </label>
                    </div>
                </div>

            </div>

            <!-- Expiry -->
            <div class="mt-4">
                <label>Expiry (Hours)</label>
                {{ form.expiry_hours }}
            </div>

            <!-- Buttons -->
            <div class="mt-5 d-flex justify-content-between align-items-center">

                <a href="{% url 'fooddonor' %}" class="btn btn-secondary">
                    ← Back
                </a>

                <button type="submit" class="btn-submit">
                    Submit
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
